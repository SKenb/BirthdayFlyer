        <script>
            const root = document.documentElement;
            const inputs = document.querySelectorAll('.palette-input');
            const presetSelect = document.getElementById('palette-presets');

            const syncInputsFromRoot = () => {
                inputs.forEach((input) => {
                    const index = input.dataset.palette;
                    const current = getComputedStyle(root).getPropertyValue(`--palette-${index}`).trim();
                    if (current) {
                        input.value = current;
                    }
                });
            };

            inputs.forEach((input) => {
                const index = input.dataset.palette;
                input.addEventListener('input', (event) => {
                    root.style.setProperty(`--palette-${index}`, event.target.value);
                    presetSelect.value = '';
                });
            });

            presetSelect.addEventListener('change', (event) => {
                const option = event.target.selectedOptions[0];
                const colors = option?.dataset?.colors;
                if (!colors) {
                    return;
                }
                colors.split(',').forEach((color, index) => {
                    root.style.setProperty(`--palette-${index + 1}`, color.trim());
                });
                syncInputsFromRoot();
            });

            syncInputsFromRoot();
        </script>
